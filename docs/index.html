<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>In Falsus 制卡配队计算器</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon" sizes="32x32">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="topbar"
      ><div
        ><p class="eyebrow">IN FALSUS / COLLECTION</p>
        <div class="title-row"
          ><h1>In Falsus 制卡配队计算器</h1>
          <a class="guide-link" href="./guide.html">使用说明</a>
        </div></div
      ><div class="header-meta"
        ><span id="summary" class="badge"></span><span id="created" class="help"></span></div
      ></header
    >
    <main>
      <div id="notice" class="notice" hidden></div>
      <nav class="tabs" aria-label="页面"
        ><button class="tab active" data-tab="recipes" type="button">卡牌一览</button
        ><button class="tab" data-tab="encounters" type="button">回想配队</button
        ><button class="tab" data-tab="b50" type="button">Best 50</button></nav
      >
      <section id="recipes-tab" class="tab-content">
        <details class="panel library-controls card-library-filters" open>
          <summary
            ><h2>卡牌筛选</h2
            ><a
              class="help-link"
              href="./guide.html#crafting"
              aria-label="查看制卡与筛选说明"
              title="查看制卡与筛选说明"
              >？</a
            ></summary
          >
          <button id="clear-recipe-filters" class="secondary filter-reset" type="button">全部重置</button>
          <div class="base-filter-grid">
            <section class="visual-filter-block level-filter"
              ><h3>等级</h3
              ><fieldset id="tier-options" class="filter-tiles level-tiles" aria-label="等级多选"></fieldset></section
            >
            <section class="visual-filter-block color-filter-block"
              ><h3>颜色</h3
              ><fieldset id="color-options" class="filter-tiles color-tiles" aria-label="颜色多选"></fieldset
              ><button
                id="include-chromatic"
                type="button"
                class="filter-tile chromatic-filter-tile"
                title="选颜色后，开启此项也会显示能变成该颜色的卡牌。"
                aria-pressed="false"
                >包含可变更色彩的卡牌</button
              ></section
            >
            <div class="recipe-picker"
              ><label for="recipe-search">搜索并选择卡牌</label
              ><div id="recipe-multiselect" class="multi-select"
                ><div id="selected-recipes" class="multi-select-values"></div>
                <input
                  id="recipe-search"
                  type="search"
                  role="combobox"
                  placeholder="输入卡牌名称"
                  autocomplete="off"
                  aria-autocomplete="list"
                  aria-controls="recipe-options"
                  aria-expanded="false"
                  aria-haspopup="listbox"
                ><div
                  id="recipe-options"
                  class="multi-select-options"
                  role="listbox"
                  aria-multiselectable="true"
                  hidden
                ></div></div
              ></div
            >
          </div>
          <div class="advanced-filter-grid">
            <label class="number-filter"
              >槽位<span
                ><select id="slots-op" aria-label="槽位比较方式"
                  ><option value="">不限</option><option value="eq">=</option><option value="gt">&gt;</option
                  ><option value="gte">&gt;=</option><option value="lt">&lt;</option
                  ><option value="lte">&lt;=</option></select
                ><select id="slots-value" aria-label="槽位数值"
                  ><option value="0">0</option><option value="1">1</option><option value="2">2</option
                  ><option value="3">3</option></select
                ></span
              ></label
            >
            <label class="number-filter"
              >左范围<span
                ><select id="left-op" aria-label="左范围比较方式"
                  ><option value="">不限</option><option value="eq">=</option><option value="gt">&gt;</option
                  ><option value="gte">&gt;=</option><option value="lt">&lt;</option
                  ><option value="lte">&lt;=</option></select
                ><select id="left-value" aria-label="左范围数值"
                  ><option value="0">0</option><option value="1">1</option><option value="2">2</option
                  ><option value="3">3</option><option value="4">4</option></select
                ></span
              ></label
            >
            <label class="number-filter"
              >右范围<span
                ><select id="right-op" aria-label="右范围比较方式"
                  ><option value="">不限</option><option value="eq">=</option><option value="gt">&gt;</option
                  ><option value="gte">&gt;=</option><option value="lt">&lt;</option
                  ><option value="lte">&lt;=</option></select
                ><select id="right-value" aria-label="右范围数值"
                  ><option value="0">0</option><option value="1">1</option><option value="2">2</option
                  ><option value="3">3</option><option value="4">4</option></select
                ></span
              ></label
            >
            <label class="number-filter"
              >总惩罚<span
                ><select id="strikes-op" aria-label="总惩罚比较方式"
                  ><option value="">不限</option><option value="eq">=</option><option value="gt">&gt;</option
                  ><option value="gte">&gt;=</option><option value="lt">&lt;</option
                  ><option value="lte">&lt;=</option></select
                ><select id="strikes-value" aria-label="总惩罚数值"
                  ><option value="0">0</option><option value="1">1</option><option value="2">2</option></select
                ></span
              ></label
            >
          </div>
        </details>
        <details class="panel library-controls" open>
          <summary><h2>卡牌排序</h2><span id="recipe-count" class="badge"></span></summary>
          <div class="sort-controls"
            ><label
              >条件1<span
                ><select id="sort-field-1"
                  ><option value="order" selected>卡牌默认顺序</option><option value="power">卡牌攻击</option
                  ><option value="fortitude">卡牌防御</option><option value="total">攻防之和</option
                  ><option value="range">范围总和</option><option value="left">左范围</option
                  ><option value="right">右范围</option><option value="slots">槽位数</option
                  ><option value="strikes">总惩罚</option><option value="tier">等级</option
                  ><option value="name">名称</option></select
                ><select id="sort-direction-1" aria-label="条件1方向"
                  ><option value="desc">降序</option><option value="asc" selected>升序</option></select
                ></span
              ></label
            ><label
              >条件2<span
                ><select id="sort-field-2"
                  ><option value="" selected>不设置</option><option value="order">卡牌默认顺序</option
                  ><option value="power">卡牌攻击</option><option value="fortitude">卡牌防御</option
                  ><option value="total">攻防之和</option><option value="range">范围总和</option
                  ><option value="left">左范围</option><option value="right">右范围</option
                  ><option value="slots">槽位数</option><option value="strikes">总惩罚</option
                  ><option value="tier">等级</option><option value="name">名称</option></select
                ><select id="sort-direction-2" aria-label="条件2方向"
                  ><option value="desc">降序</option><option value="asc">升序</option></select
                ></span
              ></label
            ><label
              >条件3<span
                ><select id="sort-field-3"
                  ><option value="" selected>不设置</option><option value="order">卡牌默认顺序</option
                  ><option value="power">卡牌攻击</option><option value="fortitude">卡牌防御</option
                  ><option value="total">攻防之和</option><option value="range">范围总和</option
                  ><option value="left">左范围</option><option value="right">右范围</option
                  ><option value="slots">槽位数</option><option value="strikes">总惩罚</option
                  ><option value="tier">等级</option><option value="name">名称</option></select
                ><select id="sort-direction-3" aria-label="条件3方向"
                  ><option value="desc">降序</option><option value="asc">升序</option></select
                ></span
              ></label
            ></div
          >
        </details>
        <div id="results" class="card-strip library-card-grid"></div>
        <nav id="library-pagination" class="library-pagination" aria-label="卡牌结果分页"
          ><label
            >每页<select id="library-page-size"
              ><option value="10">10张</option><option value="20" selected>20张</option>
              <option value="30">30张</option><option value="50">50张</option><option value="100">100张</option></select
            ></label
          ><button id="library-page-prev" type="button" class="secondary" title="上一页" aria-label="上一页">←</button
          ><span id="library-page-status"></span
          ><button id="library-page-next" type="button" class="secondary" title="下一页" aria-label="下一页"
            >→</button
          ></nav
        >
      </section>
      <section id="encounters-tab" class="tab-content" hidden>
        <div class="filters panel encounter-filters"
          ><label class="wide">回想<select id="encounter-select"></select></label
          ><label class="penalty-control"
            >单卡惩罚上限 <output id="encounter-strikes-value">2</output>
            <input id="encounter-strikes" type="range" min="0" max="2" value="2" step="1"></label
          ><label class="rating-control"
            >谱面等级 <output id="encounter-rating-value">10</output>
            <input id="encounter-rating" type="range" min="1" max="20" value="10" step="1"></label
          ><label
            >总判定数
            <input
              id="encounter-notes"
              type="number"
              min="25"
              max="32767"
              value="1000"
              step="1"
              required
              aria-describedby="note-count-help"
            ></label
          ></div
        >
        <p id="note-count-help" class="help"
          >填结算页的总判定数，长条也算在内。分数按全EXACT计算。<a
            class="help-link"
            href="./guide.html#battle"
            aria-label="查看判定数与战斗计算说明"
            title="查看判定数与战斗计算说明"
            >？</a
          ></p
        >
        <p id="encounter-loading" class="help" role="status">请选择回想。</p>
        <div id="encounter-content" hidden>
          <div class="section-intro"
            ><div
              ><h2 id="encounter-title">回想</h2><p id="battle-condition"></p></div
            ><span id="battle-status" class="badge"></span></div
          >
          <section class="panel encounter-drops" aria-labelledby="drops-title">
            <h3 id="drops-title"
              >掉落与技能来源
              <a
                class="help-link"
                href="./guide.html#drops"
                aria-label="查看掉落数量与概率说明"
                title="查看掉落数量与概率说明"
                >？</a
              ></h3
            >
            <div id="encounter-drops"></div>
          </section>
          <section class="battle-cards" aria-label="敌我配队"
            ><h3>敌我配队</h3>
            <div
              id="enemy-totals"
              class="deck-totals"
              aria-label="对方总攻防"
              title="开战前总攻防，包含对应位置的颜色克制，还未计入阶段技能。"
            ></div>
            <div
              id="deck-matchups"
              class="card-strip battle-card-grid"
              aria-label="上方为对方卡牌，下方为我方卡牌"
            ></div>
            <div
              id="player-totals"
              class="deck-totals"
              aria-label="我方总攻防"
              title="开战前总攻防，包含颜色克制、联觉与谱面等级，还未计入阶段技能。"
            ></div>
          </section>
          <section class="panel battle-process-panel" aria-labelledby="battle-process-title">
            <h3 id="battle-process-title"
              >战斗过程
              <a class="help-link" href="./guide.html#battle" aria-label="查看配队与战斗说明" title="查看配队与战斗说明"
                >？</a
              ></h3
            >
            <div id="battle-process" class="battle-process"></div>
          </section>
          <div class="team-note">
            <p
              >每张卡的惩罚都不超过所设上限。改等级或判定数会重算这队的分数；点我方卡牌查看拼法。<a
                class="help-link"
                href="./guide.html#battle"
                aria-label="查看推荐配队的计算条件"
                title="查看推荐配队的计算条件"
                >？</a
              ></p
            >
          </div>
        </div>
      </section>
      <section id="b50-tab" class="tab-content" hidden>
        <div class="panel b50-source">
          <p
            >来源：
            <a href="https://github.com/unknnownnn003/infalsus-b50" target="_blank" rel="noopener noreferrer"
              >unknnownnn003 / infalsus-b50（GitHub）</a
            >
            ·
            <a href="https://unknnownnn003.github.io/infalsus-b50/" target="_blank" rel="noopener noreferrer">原网页</a>
          </p>
          <a class="guide-link" href="./b50/index.html" target="_blank" rel="noopener noreferrer">独立打开</a>
        </div>
        <p id="b50-loading" class="help" role="status">正在加载 Best 50…</p>
        <iframe id="b50-frame" class="b50-frame" title="In Falsus Best 50 存档成绩工具"></iframe>
      </section>
    </main>

    <dialog id="layout-dialog">
      <div class="dialog-header">
        <div
          ><p id="layout-goals" class="eyebrow"></p
          ><div class="title-row"
            ><h2 id="layout-title">卡牌详情</h2
            ><a
              class="help-link"
              href="./guide.html#crafting"
              aria-label="查看粒子拼法与惩罚说明"
              title="查看粒子拼法与惩罚说明"
              >？</a
            ></div
          ></div
        >
        <div class="dialog-actions">
          <button
            id="show-traits"
            class="secondary"
            type="button"
            aria-haspopup="dialog"
            aria-controls="traits-dialog"
            disabled
            >可用技能</button
          >
          <button id="save-svg" class="secondary" type="button">保存拼法SVG</button>
          <button id="close-layout" class="secondary" type="button">关闭</button>
        </div>
      </div>
      <div class="layout-content">
        <aside class="layout-overview">
          <div id="layout-card"></div>
          <div id="layout-card-details" class="layout-card-details"></div>
        </aside>
        <div class="layout-workspace">
          <p class="help layout-instructions">拖动看全图，双指或滚轮缩放。点下方粒子可高亮，再点一次取消。</p>
          <div id="layout-board" class="layout-board"></div>
          <div id="piece-list" class="piece-list"></div>
        </div>
      </div>
    </dialog>
    <dialog id="traits-dialog" aria-labelledby="traits-title">
      <div class="dialog-header">
        <h2 id="traits-title">可用技能</h2>
        <button id="close-traits" class="secondary" type="button">关闭</button>
      </div>
      <div id="layout-traits" class="trait-list"></div>
    </dialog>
    <div id="trait-tooltip" class="trait-tooltip" role="tooltip" popover="manual"></div>
    <div id="toast" role="status" hidden></div>
    <script>
    const notice = document.getElementById("notice");
    if (location.protocol === "file:") {
      notice.hidden = false;
      notice.textContent = "请在项目文件夹中双击“预览网页.cmd”打开网页，查看时保留预览窗口；也可以访问 GitHub Pages。";
      document.querySelectorAll(".tabs, .tab-content").forEach((element) => {
        element.hidden = true;
      });
    } else {
      import("./app.js").catch((error) => {
        notice.hidden = false;
        notice.textContent = `页面加载失败，请刷新后重试。${error.message}`;
      });
    }
    </script>
    <noscript>请启用 JavaScript，以显示卡牌、回想计算结果和 Best 50。</noscript>
  </body>
</html>
